name: Build Medialab-Shutdown Timer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:

      # ==========================================
      # 1. Download repository
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Find and extract ZIP
      # ==========================================
      - name: Extract project
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path "." -Filter "*.zip" | Select-Object -First 1

          if (-not $zip) {
            Write-Error "ZIP file not found."
            exit 1
          }

          Write-Host "Using ZIP: $($zip.Name)"

          if (Test-Path "app") {
            Remove-Item "app" -Recurse -Force
          }

          New-Item -ItemType Directory -Path "app" -Force | Out-Null

          Expand-Archive `
            -Path $zip.FullName `
            -DestinationPath "app" `
            -Force

          Write-Host "ZIP extracted successfully."

      # ==========================================
      # 3. Setup Node
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ==========================================
      # 4. Setup Rust
      # ==========================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ==========================================
      # 5. Install frontend dependencies
      # ==========================================
      - name: Install dependencies
        working-directory: app
        shell: pwsh
        run: |
          npm install
          npm install @tauri-apps/api
          npm install --save-dev @tauri-apps/cli

      # ==========================================
      # 6. Create Tauri folders
      # ==========================================
      - name: Create Tauri structure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "app\src-tauri\src" -Force | Out-Null
          New-Item -ItemType Directory -Path "app\src-tauri\icons" -Force | Out-Null

      # ==========================================
      # 7. Create Cargo.toml
      # ==========================================
      - name: Create Cargo configuration
        shell: pwsh
        run: |
          $content = @'
[package]
name = "medialab-shutdown-timer"
version = "1.0.0"
description = "Medialab-Shutdown Timer"
authors = ["MediaLab"]
edition = "2021"

[lib]
name = "medialab_shutdown_timer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
'@

          Set-Content `
            -Path "app\src-tauri\Cargo.toml" `
            -Value $content `
            -Encoding UTF8

      # ==========================================
      # 8. Create build.rs
      # ==========================================
      - name: Create build script
        shell: pwsh
        run: |
          $content = @'
fn main() {
    tauri_build::build()
}
'@

          Set-Content `
            -Path "app\src-tauri\build.rs" `
            -Value $content `
            -Encoding UTF8

      # ==========================================
      # 9. Create native Windows Rust commands
      # ==========================================
      - name: Create native Windows backend
        shell: pwsh
        run: |
          $content = @'
#![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]

use std::process::Command;

#[tauri::command]
fn execute_action(action: String, force: bool) -> Result<(), String> {

    match action.as_str() {

        "shutdown" => {

            let mut command = Command::new("shutdown.exe");

            command
                .arg("/s")
                .arg("/t")
                .arg("0");

            if force {
                command.arg("/f");
            }

            command
                .spawn()
                .map_err(|e| format!("Shutdown failed: {}", e))?;
        }

        "restart" => {

            let mut command = Command::new("shutdown.exe");

            command
                .arg("/r")
                .arg("/t")
                .arg("0");

            if force {
                command.arg("/f");
            }

            command
                .spawn()
                .map_err(|e| format!("Restart failed: {}", e))?;
        }

        "lock" => {

            Command::new("rundll32.exe")
                .args([
                    "user32.dll,LockWorkStation"
                ])
                .spawn()
                .map_err(|e| format!("Lock failed: {}", e))?;
        }

        "sleep" => {

            Command::new("rundll32.exe")
                .args([
                    "powrprof.dll,SetSuspendState",
                    "0,1,0"
                ])
                .spawn()
                .map_err(|e| format!("Sleep failed: {}", e))?;
        }

        _ => {
            return Err(format!("Unknown action: {}", action));
        }
    }

    Ok(())
}

#[cfg_attr(mobile, tauri::mobile_entry_point)]
pub fn run() {

    tauri::Builder::default()

        .invoke_handler(
            tauri::generate_handler![
                execute_action
            ]
        )

        .run(
            tauri::generate_context!()
        )

        .expect("error while running Medialab-Shutdown Timer");
}
'@

          Set-Content `
            -Path "app\src-tauri\src\lib.rs" `
            -Value $content `
            -Encoding UTF8

      # ==========================================
      # 10. Create main.rs
      # ==========================================
      - name: Create main entry
        shell: pwsh
        run: |
          $content = @'
#![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]

fn main() {
    medialab_shutdown_timer_lib::run();
}
'@

          Set-Content `
            -Path "app\src-tauri\src\main.rs" `
            -Value $content `
            -Encoding UTF8

      # ==========================================
      # 11. Copy YOUR ICO logo
      # ==========================================
      - name: Install application icon
        shell: pwsh
        run: |
          $icon = "app\public\shutdown_power_icon.ico"

          if (-not (Test-Path $icon)) {
            Write-Error "shutdown_power_icon.ico was not found."
            exit 1
          }

          Copy-Item `
            $icon `
            "app\src-tauri\icons\icon.ico" `
            -Force

          Write-Host "YOUR ICO logo installed successfully."

      # ==========================================
      # 12. Create Tauri configuration
      # ==========================================
      - name: Create Tauri configuration
        shell: pwsh
        run: |
          $content = @'
{
  "$schema": "https://schema.tauri.app/config/2",
  "productName": "Medialab-Shutdown Timer",
  "version": "1.0.0",
  "identifier": "com.medialab.shutdown.timer",

  "build": {
    "beforeDevCommand": "npm run dev",
    "devUrl": "http://localhost:3000",
    "beforeBuildCommand": "npm run build",
    "frontendDist": "../dist"
  },

  "app": {
    "windows": [
      {
        "title": "Medialab-Shutdown Timer",
        "width": 560,
        "height": 760,
        "minWidth": 480,
        "minHeight": 650,
        "resizable": true,
        "fullscreen": false,
        "center": true
      }
    ],

    "security": {
      "csp": null
    }
  },

  "bundle": {
    "active": true,
    "targets": [
      "msi",
      "nsis"
    ],
    "icon": [
      "icons/icon.ico"
    ]
  }
}
'@

          Set-Content `
            -Path "app\src-tauri\tauri.conf.json" `
            -Value $content `
            -Encoding UTF8

      # ==========================================
      # 13. Create native.ts
      # ==========================================
      - name: Create native API bridge
        shell: pwsh
        run: |
          $content = @'
import { invoke } from "@tauri-apps/api/core";

export type NativeAction =
  | "shutdown"
  | "restart"
  | "lock"
  | "sleep";

export async function executeNativeAction(
  action: NativeAction,
  force: boolean
): Promise<void> {

  await invoke("execute_action", {
    action,
    force
  });
}
'@

          Set-Content `
            -Path "app\src\utils\native.ts" `
            -Value $content `
            -Encoding UTF8

      # ==========================================
      # 14. Connect App.tsx to native Windows
      # ==========================================
      - name: Connect timer to Windows
        shell: pwsh
        run: |

          $file = "app\src\App.tsx"

          $content = Get-Content `
            $file `
            -Raw

          # Add native import
          $import = "import { executeNativeAction } from './utils/native';"

          if ($content -notmatch "executeNativeAction") {

            $content = $content.Replace(
              "import { MediaLabLogo } from './components/MediaLabLogo';",
              "import { MediaLabLogo } from './components/MediaLabLogo';`r`n$import"
            )
          }

          # Replace timer expiration
          $oldExpiration = @'
            setIsRunning(false);
            sounds.playAlarm();
            setIsLockScreenActive(true);
            return 0;
'@

          $newExpiration = @'
            setIsRunning(false);
            sounds.playAlarm();

            void executeNativeAction(
              actionType,
              forceKill
            ).catch((error) => {
              console.error(
                "Windows action failed:",
                error
              );
            });

            return 0;
'@

          if ($content.Contains($oldExpiration)) {

            $content = $content.Replace(
              $oldExpiration,
              $newExpiration
            )

          } else {

            Write-Error "Timer expiration block was not found."
            exit 1
          }

          Set-Content `
            -Path $file `
            -Value $content `
            -Encoding UTF8

          Write-Host "Timer connected to Windows native commands."

      # ==========================================
      # 15. Configure package name
      # ==========================================
      - name: Configure package
        shell: pwsh
        run: |

          $file = "app\package.json"

          $package = Get-Content `
            $file `
            -Raw |
            ConvertFrom-Json

          $package.name = "medialab-shutdown-timer"
          $package.version = "1.0.0"
          $package.description = "Medialab-Shutdown Timer"

          $package |
            ConvertTo-Json -Depth 20 |
            Set-Content `
              -Path $file `
              -Encoding UTF8

      # ==========================================
      # 16. Build React
      # ==========================================
      - name: Build React
        working-directory: app
        shell: pwsh
        run: |
          npm run build

      # ==========================================
      # 17. Verify everything
      # ==========================================
      - name: Verify build files
        shell: pwsh
        run: |

          $files = @(
            "app\src-tauri\Cargo.toml",
            "app\src-tauri\build.rs",
            "app\src-tauri\src\lib.rs",
            "app\src-tauri\src\main.rs",
            "app\src-tauri\tauri.conf.json",
            "app\src-tauri\icons\icon.ico",
            "app\src\utils\native.ts"
          )

          foreach ($file in $files) {

            if (-not (Test-Path $file)) {

              Write-Error "Missing: $file"
              exit 1
            }

            Write-Host "[OK] $file"
          }

      # ==========================================
      # 18. Build Windows EXE / MSI / NSIS
      # ==========================================
      - name: Build Tauri application
        working-directory: app
        shell: pwsh
        run: |
          npx tauri build --bundles nsis,msi

      # ==========================================
      # 19. Upload installers
      # ==========================================
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Medialab-Shutdown-Timer-Windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
